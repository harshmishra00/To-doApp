<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="theme-toggle-container">
        <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">🌙 Dark Mode</button>
    </div>

    <div class="container">
        <header>
            <h1>Task Manager</h1>
            <p>Stay organized and productive</p>
        </header>

        <section class="task-form-section">
            <form id="taskForm">
                <div class="input-group">
                    <input type="text" id="taskTitle" placeholder="Task title..." maxlength="100" autocomplete="off">
                    <span id="titleError" class="error-message">Task title cannot be empty</span>
                </div>
                <div class="input-group">
                    <textarea id="taskDesc" placeholder="Description (optional)..." rows="2"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Add Task</button>
            </form>
        </section>

        <section class="controls-section">
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search tasks...">
            </div>
            
            <div class="filter-container">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
        </section>

        <section class="task-list-section">
            <div id="taskList" class="task-list">
            </div>
            <div id="emptyMessage" class="empty-message hidden">
                <p>No tasks found.</p>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
